<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Japanese Character Recognizer</title>
  <desc id="d">Banner showing a drawing canvas with the character あ, a model dropdown, a confidence ring and UI controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1edff"/>
      <stop offset="1" stop-color="#d3dcff"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d3df2"/>
      <stop offset="1" stop-color="#4f2bd6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="1" stop-color="#ff8cb5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4f2bd6" flood-opacity="0.18"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4f2bd6" flood-opacity="0.22"/>
    </filter>
    <g id="ka" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M440 203 Q485 192 530 199"/>
      <path d="M489 166 C486 212 480 258 473 292 C469 312 462 322 452 318"/>
      <path d="M446 240 C480 222 540 236 540 278 C540 322 490 338 458 320 C430 304 440 262 478 262"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1000" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="40" r="90" fill="#ffffff" opacity="0.35"/>
  <circle cx="40" cy="420" r="110" fill="#ffffff" opacity="0.3"/>

  <!-- title -->
  <text x="500" y="74" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="50" font-weight="800" fill="#5127d8">Japanese Character Recognizer</text>
  <text x="500" y="106" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#6b64a0">Draw a kana · pick a model · get the answer</text>

  <!-- LEFT: buttons, toggle, slider -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700">
    <rect x="50" y="150" width="170" height="50" rx="25" fill="url(#btn)" filter="url(#sh2)"/>
    <text x="135" y="182" text-anchor="middle" font-size="19" fill="#fff">Draw</text>

    <rect x="50" y="218" width="170" height="50" rx="25" fill="#ffffff" filter="url(#sh2)"/>
    <text x="135" y="250" text-anchor="middle" font-size="19" fill="#5127d8">Predict</text>

    <!-- toggle -->
    <rect x="50" y="292" width="76" height="38" rx="19" fill="#5127d8" filter="url(#sh2)"/>
    <circle cx="107" cy="311" r="14" fill="#fff"/>
    <text x="140" y="318" font-size="16" fill="#4a4378">Eraser</text>

    <!-- brush slider -->
    <text x="50" y="372" font-size="15" fill="#4a4378">Brush</text>
    <rect x="105" y="364" width="150" height="9" rx="4.5" fill="#ffffff"/>
    <rect x="105" y="364" width="92" height="9" rx="4.5" fill="#8f6bff"/>
    <circle cx="197" cy="368.5" r="12" fill="#fff" stroke="#5127d8" stroke-width="4"/>
  </g>

  <!-- CENTER: canvas card -->
  <g filter="url(#sh)">
    <rect x="320" y="132" width="330" height="270" rx="32" fill="#ffffff"/>
  </g>
  <rect x="340" y="150" width="290" height="190" rx="22" fill="#faf9ff" stroke="#d9d2ff" stroke-width="3" stroke-dasharray="9 8"/>
  <use href="#ka" stroke="#2a2352" stroke-width="14" transform="translate(485 243) scale(0.86) translate(-485 -245)"/>
  <!-- model selector pill -->
  <rect x="350" y="352" width="270" height="36" rx="18" fill="#f1edff"/>
  <text x="372" y="376" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4a4378">Model</text>
  <text x="436" y="376" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#5127d8">Rud Nano 64×64</text>
  <path d="M596 365 l8 9 l8 -9" fill="none" stroke="#5127d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- RIGHT: models dropdown -->
  <g filter="url(#sh)">
    <rect x="690" y="140" width="260" height="170" rx="22" fill="#ffffff"/>
  </g>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700">
    <text x="712" y="172" font-size="17" fill="#2a2352" font-weight="800">Models</text>
    <rect x="702" y="186" width="236" height="34" rx="12" fill="#ffffff"/>
    <text x="716" y="209" font-size="15" fill="#6b64a0">Rud Lite  ·  28×28</text>
    <rect x="702" y="226" width="236" height="34" rx="12" fill="#5127d8"/>
    <text x="716" y="249" font-size="15" fill="#fff">Rud Nano  ·  64×64</text>
    <rect x="702" y="266" width="236" height="34" rx="12" fill="#ffffff"/>
    <text x="716" y="289" font-size="15" fill="#b3aed0">More coming soon…</text>
  </g>

  <!-- RIGHT BOTTOM: confidence ring + result chip -->
  <g filter="url(#sh2)">
    <circle cx="738" cy="368" r="40" fill="#ffffff"/>
  </g>
  <circle cx="738" cy="368" r="32" fill="none" stroke="#ece8ff" stroke-width="9"/>
  <circle cx="738" cy="368" r="32" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" stroke-dasharray="197" stroke-dashoffset="16" transform="rotate(-90 738 368)"/>
  <text x="738" y="374" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#2a2352">92%</text>

  <g filter="url(#sh2)">
    <rect x="794" y="338" width="156" height="60" rx="30" fill="#ffffff"/>
  </g>
  <circle cx="826" cy="368" r="20" fill="#ff8cb5"/>
  <use href="#ka" stroke="#2a2352" stroke-width="20" transform="translate(826 368) scale(0.14) translate(-485 -245)"/>
  <text x="858" y="361" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#6b64a0">Best match</text>
  <text x="858" y="384" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#5127d8">a</text>
</svg>
